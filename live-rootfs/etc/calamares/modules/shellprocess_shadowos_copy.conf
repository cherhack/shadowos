---
dontChroot: true
timeout: 600
script:
  - command: "mkdir -p ${ROOT}/opt/shadowos"
  - command: "rsync -aHAX /opt/shadowos/payload/rootfs/ ${ROOT}/"
    timeout: 300
    verbose: true
  - command: "rsync -aHAX /opt/shadowos/DarkShadowShell/ ${ROOT}/opt/shadowos/DarkShadowShell/"
    timeout: 300
    verbose: true
  - command: "mkdir -p ${ROOT}/usr/share/licenses/shadowos"
  - command: "rsync -a /opt/shadowos/licenses/ ${ROOT}/usr/share/licenses/shadowos/"
  - command: "cp /opt/shadowos/CACHYOS_COMMIT /opt/shadowos/DARKSHADOWSHELL_COMMIT /opt/shadowos/INSTALLED_PACKAGES /opt/shadowos/LIVE_PACKAGES ${ROOT}/opt/shadowos/"

i18n:
  name: "Copying ShadowOS components"
  name[ru]: "Копирование компонентов ShadowOS"
